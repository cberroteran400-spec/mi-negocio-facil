name: Generar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar aplicación web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar icono desde icon.png
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp icon.png resources/icon.png
          npx capacitor-assets generate --android
      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Generar APK
        run: cd android && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Negocio-Facil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
